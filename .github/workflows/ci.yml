name: CI

# GitHub Actions discovers workflows only at the repository root. The project
# itself lives in autonomous-pr-fixer/, so each run step uses that directory.
# No secrets are used. Docker-dependent tests skip themselves when the engine
# or the sandbox image is unavailable.

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: autonomous-pr-fixer

jobs:
  test:
    name: Lint, types, tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: autonomous-pr-fixer/requirements.lock

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.lock

      - name: Ruff (Phase 2 scope)
        run: python -m ruff check repair/retrieval evaluation/localization tests/test_retrieval_phase2.py tests/test_retrieve_tool.py

      - name: Mypy (Phase 2 scope)
        run: python -m mypy repair/retrieval evaluation/localization

      - name: Import smoke check
        run: python -c "import github.app_service, repair.interface, main"

      - name: Tests
        run: python -m pytest -q --tb=short

  secret-audit:
    name: Hard-coded secret audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Scan for common secret patterns
        shell: bash
        working-directory: .
        run: |
          if grep -RInE --exclude-dir=.git --exclude-dir=tests --include='*.py' \
            '(gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|sk-[A-Za-z0-9]{20,}|AIza[A-Za-z0-9_-]{20,})' \
            autonomous-pr-fixer; then
            echo "ERROR: Possible hard-coded secrets found!"
            exit 1
          fi
          echo "No token-shaped secrets detected."
