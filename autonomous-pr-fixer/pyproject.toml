# Dependency manifest. The project runs from this source tree (python main.py ...);
# exact versions for CI and reproducible installs are in requirements.lock.
[project]
name = "cerberus"
version = "2.0.0"
description = "Autonomous patch verification gate, GitHub App and tool-calling repair agent"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pydantic>=2.10.0",
    "pytest>=8.0.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "litellm>=1.50.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "cryptography>=42.0",
    "anthropic>=1.0",
    "langfuse>=3,<4",
    "numpy>=2.0",
]

[project.optional-dependencies]
retrieval = ["qdrant-client>=1.12", "fastembed>=0.5"]
langgraph = ["langgraph>=1.0", "langgraph-checkpoint-sqlite>=3.0"]
swebench = ["swebench>=4.0", "pandas>=2.2", "pyarrow>=17"]
dev = ["ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]
packages = { find = { include = ["agents*", "harness*", "github*", "repair*", "retrieval*", "evaluation*"] } }
