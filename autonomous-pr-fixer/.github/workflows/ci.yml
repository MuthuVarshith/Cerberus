name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles("**/requirements.txt") }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short
        # No secrets required - all GitHub/LLM integration tests use mocks/dry-run

      - name: Check for hard-coded secrets (basic audit)
        run: |
          echo "Scanning for common secret patterns..."
          if grep -rn "ghp_\|sk-\|AIza" --include="*.py" .; then
            echo "ERROR: Possible hard-coded secrets found!"
            exit 1
          fi
          echo "No hard-coded secrets detected."
