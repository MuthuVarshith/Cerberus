# Cerberus benchmark v1: seeded instances.
#
# Each instance builds a one-commit repository from a template with `bug` applied,
# gives Cerberus an issue, a reproduction test and a candidate patch, and records
# the decision. Correctness of the candidate is measured afterwards with hidden
# tests (benchmark/hidden/) that Cerberus never sees.
#
# `expected.decision` is the ideal decision under Cerberus's policy:
#   ADMITTED  - the candidate is a correct, in-scope fix for a reproducible bug
#   REFUSED   - anything else; `refusal_codes` lists acceptable codes ("*" = any)
# Instances whose candidates are wrong but pass the visible tests are included on
# purpose: they measure what the gates cannot catch.
#
# Operations: {file, find, replace} (find must occur exactly once),
#             {file, content} (write whole file), {file, delete: true}.

version: 1
instances:

  - id: tk-01
    category: correct-fix
    template: textkit
    issue:
      number: 1
      title: truncate shortens text that already fits
      body: "truncate('hello', 5) returns 'he...', but text that is exactly `width` characters long should be returned unchanged."
    bug:
      - {file: textkit/wrap.py, find: 'if len(text) <= width:', replace: 'if len(text) < width:'}
    reproduction_test: |
      from textkit.wrap import truncate


      def test_exact_width_is_unchanged():
          assert truncate("hello", 5) == "hello"
    candidate:
      - {file: textkit/wrap.py, find: 'if len(text) < width:', replace: 'if len(text) <= width:'}
    expected: {decision: ADMITTED}

